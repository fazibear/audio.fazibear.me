category: MP3 compression effect
headline: Make compression part of the sound.
description: |
  Turn real MP3 compression into a creative effect. Llamafier processes your audio
  through the LAME codec, with Bitrate and Quality controls to shape the compression
  artifacts.
formats:
  - VST3
  - AU
  - CLAP
features:
  - Real LAME MP3 processing
  - Adjustable bitrate
  - Encoder quality control
sections:
- eyebrow: The engine
  title: Real MP3 compression.<br>Real artifacts.
  text: |
    Llamafier adds the sound of lossy MP3 compression by actually encoding and decoding
    your audio through the LAME codec. Bring those compression artifacts into your mix and
    use them as part of the texture.
